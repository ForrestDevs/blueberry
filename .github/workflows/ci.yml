name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  agent:
    runs-on: macos-15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - run: swift test
